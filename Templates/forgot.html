<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — MedBox Alert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="animated-bg"></div>

<div class="page-center">
    <div class="card">

        <div class="page-icon">🔑</div>
        <h2 class="page-title">Forgot Password</h2>
        <p class="page-subtitle">Enter your phone number to receive an OTP</p>

        <form method="POST" action="/forgot">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="input-field"
                       placeholder="Enter your phone number" required>
            </div>

            <button type="submit" class="btn btn-primary">Send OTP</button>
        </form>

        <a href="/login_page" class="back-link">← Back to Login</a>

    </div>
</div>

</body>
</html>
