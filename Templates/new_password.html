<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password — MedBox Alert</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="animated-bg"></div>

<div class="page-center">
    <div class="card">

        <div class="page-icon">🔒</div>
        <h2 class="page-title">Set New Password</h2>
        <p class="page-subtitle">Choose a strong password for your account</p>

        <form method="POST" action="/set_password">
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="input-field"
                       placeholder="Enter new password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="input-field"
                       placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="btn btn-primary">Update Password</button>
        </form>

    </div>
</div>

</body>
</html>
