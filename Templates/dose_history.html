<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dose History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{{ session.get('theme','dark') }}">
<nav class="navbar">
    <div class="navbar-brand">📘 Dose History</div>
    <div class="navbar-actions">
        <a href="/dashboard" class="nav-btn">← Dashboard</a>
    </div>
</nav>
<div class="container">
    <div class="med-card" style="margin-top:20px;">
        <h3>Recent Dose Actions</h3>
        {% if records %}
            <ul style="padding-left:16px; margin-top:10px;">
                {% for r in records %}
                <li style="margin-bottom:8px;">
                    <strong>{{ r.name }}</strong> ({{ r.dose }}) — <span style="font-weight:700;">{{ r.state }}</span> at {{ r.time }}
                </li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No dose history yet. Take your first medicine and mark it as taken to populate history.</p>
        {% endif %}
    </div>
</div>
</body>
</html>
