<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MedBox AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="animated-bg"></div>

<div class="page-center">
    <div class="card">

        <div class="page-icon">🤖</div>
        <h2 class="page-title"><span class="ai-text-gradient">MedBox AI</span></h2>
        <p class="page-subtitle">Sign in to your intelligent medicine assistant</p>

        <form method="POST" action="/login" autocomplete="off">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" class="input-field"
                       placeholder="Enter your phone number"
                       autocomplete="off" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="input-field"
                       placeholder="Enter your password"
                       autocomplete="new-password" required>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div class="links-row">
            <a href="/signup_page" class="link">Create Account</a>
            <a href="/forgot_page" class="link">Forgot Password?</a>
        </div>

    </div>
</div>

</body>
</html>
